[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupaal"
version = "0.1.0"
description = "EduPAAL — a portable memory-management skill for personalized structured learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vignesh Radhakrishna" }]
keywords = ["personalization", "learner-model", "knowledge-tracing", "agent-memory", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Education",
]

[project.optional-dependencies]
# Mem0 as an EduPAAL memory provider (edupaal.providers.Mem0Provider).
# fastembed gives a local, keyless embedding model so the provider works
# out of the box; any mem0 embedder (openai, ollama, ...) can be selected
# via EDUPAAL_MEM0_EMBEDDER instead.
mem0-provider = ["mem0ai>=2.0", "fastembed>=0.3"]
# MemOS as an EduPAAL memory provider (edupaal.providers.MemOSProvider).
memos-provider = ["MemoryOS>=0.1"]
# Everything.
all-providers = ["mem0ai>=2.0", "fastembed>=0.3", "MemoryOS>=0.1"]

[project.urls]
Homepage = "https://github.com/viggyr/EduPAAL"

[tool.setuptools.packages.find]
include = ["edupaal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
